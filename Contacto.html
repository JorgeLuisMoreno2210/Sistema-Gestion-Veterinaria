<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | PetCare</title>
  
  <!-- Vinculamos el archivo CSS -->
  <link rel="stylesheet" href="css/contacto.css">
  <link rel="icon" href="Icons/favicon_io(2)/favicon.ico" type="image/x-icon">

</head>
<body>
  <!-- Sección de contacto -->
  <section class="contact-section">
    <div class="container">
        <img src="Imágenes/LogoVet.jpg" alt="Nuestro logo" title="PetCare" class="vet-logo">
      <h1>Contáctanos </h1>
      <p>¿Tienes alguna pregunta? Estamos aquí para ayudarte. Completa el formulario y te responderemos a la mayor brevedad posible.</p>

      <!-- Formulario de contacto -->
      <form action="#" method="POST" class="contact-form">
        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" placeholder="Tu nombre" required>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="Tu correo electrónico" required>
        </div>

        <div class="form-group">
          <label for="message">Mensaje</label>
          <textarea id="message" name="message" rows="5" placeholder="Escribe tu mensaje..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Enviar</button>
      </form>

      <!-- Información de contacto -->
      <div class="contact-info">
        <h2>Información de contacto</h2>
        <p><strong>Dirección:</strong> Calle Ficticia 123, Ciudad, País</p>
        <p><strong>Teléfono:</strong> +57 317 841 96 67</p>
        <p><strong>Correo:</strong> jorgelmoreno1022@gmail.com</p>
      </div>
    </div>
  </section>
  
</body>
</html>
